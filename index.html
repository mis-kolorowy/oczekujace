<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oczekujące strony - Wikisłownik</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #202122;
      --text-muted: #54595d;
      --border-color: #a2a9b1;
      --border-light: #eaecf0;
      --header-bg: #eaecf0;
      --hover-bg: #eaf3ff;
      --stripe-bg: #f8f9fa;
      --link-color: #36c;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
      --box-bg: #fafafa;
      --btn-bg: #ffffff;
    }

    body.dark-mode {
      --bg-color: #101418;
      --card-bg: #1e2329;
      --text-color: #eaecf0;
      --text-muted: #9eb0c1;
      --border-color: #444d56;
      --border-light: #2d333b;
      --header-bg: #2d333b;
      --hover-bg: #263342;
      --stripe-bg: #161b22;
      --link-color: #6dbeff;
      --badge-bg: #003758;
      --badge-text: #99d8ff;
      --box-bg: #161b22;
      --btn-bg: #2d333b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    h1 { font-size: 20px; margin: 0; }

    .theme-toggle {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label.group-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .radio-group-inline { display: flex; gap: 12px; flex-wrap: wrap; }
    .radio-label, .checkbox-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px 12px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border-light);
      padding: 8px;
      border-radius: 3px;
      background: var(--box-bg);
    }

    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .btn-small {
      font-size: 11px;
      padding: 2px 6px;
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      cursor: pointer;
    }

    .search-sub-input {
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      font-size: 12px;
      background: var(--card-bg);
      color: var(--text-color);
      margin-bottom: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    .counter { margin-bottom: 10px; font-size: 14px; font-weight: bold; }
    .pagination { margin: 15px 0; display: flex; gap: 10px; align-items: center; }
    
    button {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: var(--btn-bg);
      color: var(--text-color);
      border-radius: 3px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border-color); min-width: 600px; }
    th, td { border: 1px solid var(--border-color); padding: 8px 10px; text-align: left; font-size: 13px; }
    th { background-color: var(--header-bg); font-weight: bold; }
    tr:nth-child(even) { background-color: var(--stripe-bg); }
    tr:hover { background-color: var(--hover-bg); }

    a { color: var(--link-color); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .tag-badge { background: var(--badge-bg); color: var(--badge-text); padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; }
    #loading { font-size: 16px; color: var(--link-color); font-weight: bold; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Strony oczekujące na przejrzenie</h1>
    <button class="theme-toggle" id="themeToggleBtn">🌙 Tryb ciemny</button>
  </div>

  <div class="filter-panel">
    <div class="filter-group">
      <label class="checkbox-label">
        <input type="checkbox" id="translationEditorFilter">
        <strong>Tylko edytor tłumaczeń</strong>
      </label>
    </div>

    <div class="filter-group">
      <label class="group-title">Liczba edycji</label>
      <div class="radio-group-inline">
        <label class="radio-label"><input type="radio" name="editCountFilter" value="all" checked> Wszystkie</label>
        <label class="radio-label"><input type="radio" name="editCountFilter" value="1"> Dokładnie 1 edycja</label>
        <label class="radio-label"><input type="radio" name="editCountFilter" value="2+"> 2 lub więcej edycji</label>
      </div>
    </div>

    <div class="filter-group">
      <div class="grid-header">
        <label class="group-title">Język(i)</label>
        <button class="btn-small" id="toggleAllLangsBtn">Oznaczenie/Odznacz wszystkie</button>
      </div>
      <div class="radio-group-inline" style="margin-bottom: 4px;">
        <label class="radio-label"><input type="radio" name="langMode" value="any" checked> Między innymi dany język</label>
        <label class="radio-label"><input type="radio" name="langMode" value="only"> Tylko wybrane języki</label>
      </div>
      <div class="grid-container" id="languagesContainer"></div>
    </div>

    <div class="filter-group">
      <div class="grid-header">
        <label class="group-title">Autor(zy) edycji</label>
        <button class="btn-small" id="toggleAllUsersBtn">Oznaczenie/Odznacz wszystkich</button>
      </div>
      <div class="radio-group-inline" style="margin-bottom: 4px;">
        <label class="radio-label"><input type="radio" name="userMode" value="any" checked> Między innymi autor</label>
        <label class="radio-label"><input type="radio" name="userMode" value="only"> Tylko wybrani autorzy</label>
      </div>
      <input type="text" id="userSearchInput" class="search-sub-input" placeholder="Filtruj listę autorów...">
      <div class="grid-container" id="usersContainer"></div>
    </div>
  </div>

  <div id="loading">Wczytywanie bazy danych...</div>

  <div class="counter">
    Znaleziono: <span id="visibleCount">0</span> / <span id="totalCount">0</span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Hasło</th>
          <th>Najstarsza edycja</th>
          <th>Edycje</th>
          <th>Autor(zy)</th>
          <th>Zmienione wiersze</th>
          <th>Edytor tłum.</th>
          <th>Kategorie</th>
          <th>Linkujące</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="pagination">
    <button id="prevBtn">← Poprzednia</button>
    <span>Strona <span id="currentPage">1</span> z <span id="totalPages">1</span></span>
    <button id="nextBtn">Następna →</button>
  </div>

  <script>
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const PAGE_SIZE = 50;

    const themeBtn = document.getElementById('themeToggleBtn');
    
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-mode');
        themeBtn.textContent = '☀️ Tryb jasny';
      }
    }

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      themeBtn.textContent = isDark ? '☀️ Tryb jasny' : '🌙 Tryb ciemny';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    async function init() {
      initTheme();
      try {
        const res = await fetch('dane.json');
        rawData = await res.json();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('totalCount').textContent = rawData.length;

        populateLanguages();
        populateUsers();
        attachEventListeners();
        applyFilters();
      } catch (e) {
        document.getElementById('loading').textContent = 'Błąd wczytywania danych JSON.';
      }
    }

    function isIpAddress(user) {
      return /^(\d{1,3}\.){3}\d{1,3}$/.test(user) || /^[0-9a-fA-F:]+$/.test(user);
    }

    function isTempAccount(user) {
      return user.startsWith('~');
    }

    function populateLanguages() {
      const container = document.getElementById('languagesContainer');
      const langs = new Set();
      rawData.forEach(item => item.cats.forEach(c => langs.add(c)));
      
      let html = '';
      Array.from(langs).sort((a,b) => a.localeCompare(b, 'pl')).forEach(lang => {
        html += `
          <label class="checkbox-label lang-item">
            <input type="checkbox" name="langFilter" value="${escapeHtml(lang.toLowerCase())}" checked>
            ${escapeHtml(lang)}
          </label>
        `;
      });
      container.innerHTML = html;
    }

    function populateUsers() {
      const container = document.getElementById('usersContainer');
      const regularUsers = new Set();
      
      rawData.forEach(item => {
        item.users.forEach(u => {
          if (!isIpAddress(u) && !isTempAccount(u)) {
            regularUsers.add(u);
          }
        });
      });

      let html = `
        <label class="checkbox-label user-item" style="font-weight: bold; grid-column: 1 / -1;">
          <input type="checkbox" id="userCatIp" value="SPECIAL_IP" checked>
          [Adresy IP]
        </label>
        <label class="checkbox-label user-item" style="font-weight: bold; grid-column: 1 / -1;">
          <input type="checkbox" id="userCatTemp" value="SPECIAL_TEMP" checked>
          [Konta tymczasowe (~)]
        </label>
        <hr style="grid-column: 1 / -1; width: 100%; border: 0; border-top: 1px solid var(--border-light); margin: 4px 0;">
      `;

      Array.from(regularUsers).sort((a,b) => a.localeCompare(b, 'pl')).forEach(user => {
        html += `
          <label class="checkbox-label user-item" data-username="${escapeHtml(user.toLowerCase())}">
            <input type="checkbox" name="userFilter" value="${escapeHtml(user.toLowerCase())}" checked>
            ${escapeHtml(user)}
          </label>
        `;
      });

      container.innerHTML = html;
    }

    function attachEventListeners() {
      document.getElementById('translationEditorFilter').addEventListener('change', applyFilters);

      document.querySelectorAll('input[name="editCountFilter"]').forEach(el => {
        el.addEventListener('change', applyFilters);
      });

      document.querySelectorAll('input[name="langMode"]').forEach(el => {
        el.addEventListener('change', applyFilters);
      });

      document.querySelectorAll('input[name="userMode"]').forEach(el => {
        el.addEventListener('change', applyFilters);
      });

      document.getElementById('languagesContainer').addEventListener('change', applyFilters);
      document.getElementById('usersContainer').addEventListener('change', applyFilters);

      document.getElementById('toggleAllLangsBtn').addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('input[name="langFilter"]');
        const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
        checkboxes.forEach(cb => cb.checked = anyUnchecked);
        applyFilters();
      });

      document.getElementById('toggleAllUsersBtn').addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('#usersContainer input[type="checkbox"]');
        const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
        checkboxes.forEach(cb => cb.checked = anyUnchecked);
        applyFilters();
      });

      document.getElementById('userSearchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll('#usersContainer .user-item[data-username]').forEach(el => {
          const name = el.getAttribute('data-username');
          el.style.display = name.includes(query) ? 'flex' : 'none';
        });
      });
    }

    function applyFilters() {
      const selectedLangs = Array.from(document.querySelectorAll('input[name="langFilter"]:checked')).map(cb => cb.value);
      const langMode = document.querySelector('input[name="langMode"]:checked').value;

      const includeIp = document.getElementById('userCatIp')?.checked || false;
      const includeTemp = document.getElementById('userCatTemp')?.checked || false;
      const selectedUsers = Array.from(document.querySelectorAll('input[name="userFilter"]:checked')).map(cb => cb.value);
      const userMode = document.querySelector('input[name="userMode"]:checked').value;

      const editFilter = document.querySelector('input[name="editCountFilter"]:checked').value;
      const onlyTrans = document.getElementById('translationEditorFilter').checked;

      filteredData = rawData.filter(item => {
        const catsLower = item.cats.map(c => c.toLowerCase());
        if (langMode === 'only') {
          if (catsLower.length === 0 || !catsLower.every(c => selectedLangs.includes(c))) return false;
        } else {
          if (!catsLower.some(c => selectedLangs.includes(c))) return false;
        }

        const itemUsersLower = item.users.map(u => u.toLowerCase());
        const userMatches = (userStr) => {
          if (includeIp && isIpAddress(userStr)) return true;
          if (includeTemp && isTempAccount(userStr)) return true;
          return selectedUsers.includes(userStr);
        };

        if (userMode === 'only') {
          if (itemUsersLower.length === 0 || !itemUsersLower.every(u => userMatches(u))) return false;
        } else {
          if (!itemUsersLower.some(u => userMatches(u))) return false;
        }

        if (editFilter === '1' && item.edits !== 1) return false;
        if (editFilter === '2+' && item.edits < 2) return false;

        if (onlyTrans && !item.is_trans) return false;

        return true;
      });

      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const totalPages = Math.ceil(filteredData.length / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filteredData.slice(start, start + PAGE_SIZE);

      pageItems.forEach(item => {
        const tr = document.createElement('tr');
        const titleEnc = encodeURIComponent(item.title);
        const usersStr = item.users.join(', ');
        const transBadge = item.is_trans ? '<span class="tag-badge">tak</span>' : 'nie';

        tr.innerHTML = `
          <td><a href="https://pl.wiktionary.org/wiki/${titleEnc}" target="_blank">${escapeHtml(item.title)}</a> 
              (<a href="https://pl.wiktionary.org/w/index.php?title=${titleEnc}&action=history" target="_blank">hist.</a>)</td>
          <td>${item.oldest}</td>
          <td>${item.edits}</td>
          <td>${escapeHtml(usersStr)}</td>
          <td>${item.diff}</td>
          <td>${transBadge}</td>
          <td>(${item.cats.length}) ${escapeHtml(item.cats.join(', '))}</td>
          <td>${item.links}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('visibleCount').textContent = filteredData.length;
      document.getElementById('currentPage').textContent = currentPage;
      document.getElementById('totalPages').textContent = totalPages;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
    document.getElementById('nextBtn').addEventListener('click', () => { if (currentPage * PAGE_SIZE < filteredData.length) { currentPage++; renderTable(); } });

    init();
  </script>
</body>
</html>
